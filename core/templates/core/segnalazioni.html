<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CityLog – Mappa Segnalazioni</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface2: #222636;
            --border: rgba(255,255,255,0.08);
            --text: #e8eaf0;
            --text-muted: #7b8099;
            --accent: #4ade80;
            --accent-dim: rgba(74,222,128,0.15);
            --radius: 14px;
            --navbar-h: 0px;

            /* Tipologie */
            --color-rifiuti: #facc15;
            --color-piantumazioni: #86efac;
            --color-censimento: #16a34a;
            --color-tronchi: #92400e;
            --color-buche: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }

        /* ── MAPPA ── */
        #map {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        /* ── NAVBAR ── */
        #navbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: env(safe-area-inset-top, 12px) 12px 10px;
            padding-top: max(env(safe-area-inset-top), 12px);
            background: linear-gradient(to bottom, rgba(15,17,23,0.97) 70%, transparent);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-row {
            display: flex;
            gap: 6px;
            width: 100%;
            align-items: center;
        }

        #searchInput {
            flex: 1;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            outline: none;
            min-width: 0;
        }

        #searchInput::placeholder { color: var(--text-muted); }
        #searchInput:focus { border-color: var(--accent); }

        #quartiereFilter {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            outline: none;
            flex: 1;
            min-width: 0;
            cursor: pointer;
        }

        .nav-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s, border-color 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-btn:active { background: var(--surface); }
        .nav-btn.accent { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }

        /* ── MENU PANNELLO ── */
        #menuToggle {
            position: absolute;
            top: max(env(safe-area-inset-top), 12px);
            right: 12px;
            z-index: 1001;
            width: 40px;
            height: 40px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.15s;
        }

        #menuToggle:active { background: var(--surface); }

        #menuPanel {
            position: absolute;
            top: max(env(safe-area-inset-top), 12px);
            right: 12px;
            z-index: 1000;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            min-width: 180px;
            transform: scale(0.9) translateY(-10px);
            transform-origin: top right;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        #menuPanel.open {
            transform: scale(1) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .menu-section-title {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            margin-top: 12px;
        }

        .menu-section-title:first-child { margin-top: 0; }

        .style-btns {
            display: flex;
            gap: 4px;
        }

        .style-btn {
            flex: 1;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .style-btn.active {
            background: var(--accent-dim);
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .filter-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .filter-label {
            font-size: 0.85rem;
            flex: 1;
        }

        .filter-check {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }

        /* ── SCHEDA INFO ── */
        #infoPanel {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2000;
            background: var(--surface);
            border-top: 1px solid var(--border);
            border-radius: 20px 20px 0 0;
            max-height: 75vh;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            display: flex;
            flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        #infoPanel.open {
            transform: translateY(0);
        }

        #infoDragHandle {
            padding: 12px 16px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            cursor: default;
        }

        #infoDragHandle::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
        }

        #infoTitle {
            font-size: 0.9rem;
            font-weight: 600;
            padding-top: 4px;
        }

        #infoClose {
            width: 28px;
            height: 28px;
            background: var(--surface2);
            border: none;
            border-radius: 50%;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        #infoContent {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 4px 16px 20px;
            flex: 1;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }

        .info-row:last-child { border-bottom: none; }

        .info-key {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-family: 'DM Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            flex-shrink: 0;
            padding-top: 2px;
        }

        .info-val {
            font-size: 0.85rem;
            text-align: right;
            word-break: break-word;
        }

        .info-val.highlight {
            color: var(--accent);
            font-weight: 600;
            font-family: 'DM Mono', monospace;
        }

        .info-section-divider {
            height: 1px;
            background: var(--border);
            margin: 12px 0;
        }

        .info-section-heading {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            margin: 12px 0 8px;
        }

        .quartiere-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .quartiere-row strong { color: var(--text); }

        /* ── LEGENDA ── */
        #legend {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
            left: 12px;
            z-index: 999;
            background: rgba(26,29,39,0.92);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            backdrop-filter: blur(8px);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ── STATUS ── */
        #status {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(26,29,39,0.92);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.75rem;
            font-family: 'DM Mono', monospace;
            color: var(--text-muted);
            backdrop-filter: blur(8px);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #status.visible { opacity: 1; }

        /* ── CONTROLLI ZOOM ── */
        .leaflet-control-zoom {
            border: 1px solid var(--border) !important;
            border-radius: 10px !important;
            overflow: hidden;
        }

        .leaflet-control-zoom a {
            background: var(--surface) !important;
            color: var(--text) !important;
            border-color: var(--border) !important;
        }

        .leaflet-control-zoom a:hover {
            background: var(--surface2) !important;
        }

        /* ── POPUP ── */
        .leaflet-popup-content-wrapper {
            background: var(--surface) !important;
            color: var(--text) !important;
            border: 1px solid var(--border) !important;
            border-radius: 12px !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
            overflow: visible !important;
        }

        .leaflet-popup-tip { background: var(--surface) !important; }

        .popup-body { font-size: 0.82rem; line-height: 1.6; }
        .popup-type { font-weight: 600; margin-bottom: 4px; }
        .popup-addr { color: var(--text-muted); margin-bottom: 6px; }
        .popup-date { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--text-muted); }
        .popup-img-btn {
            margin-top: 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
        }

        .popup-img-wrapper {
            display: none;
            margin-top: 8px;
            border-radius: 8px;
            width: 100%;
            position: relative;
            transition: height 0.3s ease;
        }
        .popup-img-wrapper.visible { display: block; }
        .popup-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            transform-origin: center center;
            transition: transform 0.3s ease;
        }
        .img-controls { display: none; gap: 4px; margin-top: 6px; }
        .img-controls.visible { display: flex; }
        .img-rotate-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            flex: 1;
            text-align: center;
        }

        /* ── CLUSTER ── */
        .cl-icon {
            border-radius: 50%;
            display: flex !important;
            align-items: center;
            justify-content: center;
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            font-weight: 500;
            color: #000;
            border: 2px solid rgba(255,255,255,0.3);
        }

        /* ── OVERLAY chiudi menu al click esterno ── */
        #menuOverlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: none;
        }

        #menuOverlay.active { display: block; }

        /* ── DEBUG PANEL ── */
        #debugPanel {
            position: absolute;
            bottom: 80px;
            left: 12px;
            right: 12px;
            z-index: 1002;
            background: rgba(26,29,39,0.95);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
            max-height: 180px;
            overflow-y: auto;
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            color: #4ade80;
            backdrop-filter: blur(8px);
            display: none;
            transition: opacity 0.3s;
        }

        #debugPanel.visible {
            display: block;
        }

        #debugPanel .debug-entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            white-space: pre-wrap;
            word-break: break-all;
        }

        #debugPanel .debug-entry.warn {
            color: #facc15;
        }

        #debugPanel .debug-entry.error {
            color: #f87171;
        }

        #debugPanel .debug-entry.success {
            color: #4ade80;
        }

        #debugToggle {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 50px);
            right: 12px;
            z-index: 1002;
            background: rgba(26,29,39,0.9);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.6rem;
            cursor: pointer;
            font-family: 'DM Mono', monospace;
            backdrop-filter: blur(8px);
        }

        /* ── DESKTOP ── */
        @media (min-width: 769px) {
            #infoPanel {
                position: absolute !important;
                left: 12px !important;
                bottom: 60px !important;
                right: auto !important;
                width: 300px;
                max-height: 420px;
                border-radius: var(--radius) !important;
                border: 1px solid var(--border) !important;
                transform: none !important;
                display: none;
            }

            #infoPanel.open { display: flex !important; }
            #infoDragHandle::before { display: none; }
        }

        /* Loading spinner */
        .loading-dot {
            display: inline-block;
            animation: pulse 1.2s ease-in-out infinite;
            color: var(--accent);
            font-family: 'DM Mono', monospace;
            font-size: 0.75rem;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

<!-- MAPPA -->
<div id="map"></div>

<!-- OVERLAY per chiudere menu -->
<div id="menuOverlay"></div>

<!-- NAVBAR -->
<div id="navbar">
    <div class="nav-row">
        <input type="text" id="searchInput" placeholder="Cerca indirizzo..."
               onkeypress="if(event.key==='Enter') searchAddress()">
        <select id="quartiereFilter" onchange="filterByQuartiere()">
            <option value="">Tutti i quartieri</option>
        </select>
    </div>
    <div class="nav-row">
        <button class="nav-btn" onclick="searchAddress()">Cerca</button>
        <button class="nav-btn" onclick="exportCSV()">CSV</button>
        <button class="nav-btn accent" onclick="openInfo()">Info</button>
        <button class="nav-btn" onclick="locateUser()">📍</button>
        <button class="nav-btn" onclick="centerMap()">Centra</button>
        <button class="nav-btn" onclick="showAll()">Tutti</button>
    </div>
</div>

<!-- MENU TOGGLE -->
<button id="menuToggle" onclick="toggleMenu()">☰</button>

<!-- MENU PANNELLO -->
<div id="menuPanel">
    <div class="menu-section-title">Stile mappa</div>
    <div class="style-btns">
        <button class="style-btn" id="btn-std" onclick="setStyle('std')">Standard</button>
        <button class="style-btn" id="btn-voyager" onclick="setStyle('voyager')">Voyager</button>
        <button class="style-btn active" id="btn-light" onclick="setStyle('light')">Chiaro</button>
    </div>
    <div class="menu-section-title">Livelli</div>
    <label class="filter-row" onclick="toggleLayer('rifiuti')">
        <div class="filter-dot" style="background:var(--color-rifiuti)"></div>
        <span class="filter-label">Rifiuti</span>
        <input type="checkbox" id="chkRifiuti" class="filter-check" onclick="event.stopPropagation(); toggleLayer('rifiuti')">
    </label>
    <label class="filter-row" onclick="toggleLayer('ambiente')">
        <div class="filter-dot" style="background:var(--color-piantumazioni)"></div>
        <span class="filter-label">Ambiente</span>
        <input type="checkbox" id="chkAmbiente" class="filter-check" onclick="event.stopPropagation(); toggleLayer('ambiente')">
    </label>
    <label class="filter-row" onclick="toggleLayer('buche')">
        <div class="filter-dot" style="background:var(--color-buche)"></div>
        <span class="filter-label">Buche</span>
        <input type="checkbox" id="chkBuche" class="filter-check" onclick="event.stopPropagation(); toggleLayer('buche')">
    </label>
</div>

<!-- SCHEDA INFO -->
<div id="infoPanel">
    <div id="infoDragHandle">
        <span id="infoTitle">Statistiche</span>
        <button id="infoClose" onclick="closeInfo()">✕</button>
    </div>
    <div id="infoContent">
        <!-- Dati marker selezionato -->
        <div id="markerSection" style="display:none;">
            <div class="info-section-heading">Marker selezionato</div>
            <div class="info-row">
                <span class="info-key">Tipo</span>
                <span class="info-val" id="iType">-</span>
            </div>
            <div class="info-row">
                <span class="info-key">Indirizzo</span>
                <span class="info-val" id="iAddr">-</span>
            </div>
            <div class="info-row">
                <span class="info-key">Quartiere</span>
                <span class="info-val" id="iQuartiere">-</span>
            </div>
            <div class="info-row">
                <span class="info-key">Data</span>
                <span class="info-val" id="iDate">-</span>
            </div>
            <div class="info-row">
                <span class="info-key">Coordinate</span>
                <span class="info-val" id="iCoords">-</span>
            </div>
            <div class="info-section-divider"></div>
        </div>

        <!-- Contatori -->
        <div class="info-section-heading">Riepilogo</div>
        <div class="info-row">
            <span class="info-key">Oggi</span>
            <span class="info-val highlight" id="cntToday">0</span>
        </div>
        <div class="info-row">
            <span class="info-key">Totale</span>
            <span class="info-val highlight" id="cntTotal">0</span>
        </div>
        <div class="info-row">
            <span class="info-key">Rifiuti</span>
            <span class="info-val" id="cntRifiuti">0</span>
        </div>
        <div class="info-row">
            <span class="info-key">Piantumazioni</span>
            <span class="info-val" id="cntPiantumazioni">0</span>
        </div>
        <div class="info-row">
            <span class="info-key">Censimento</span>
            <span class="info-val" id="cntCensimento">0</span>
        </div>
        <div class="info-row">
            <span class="info-key">Tronchi</span>
            <span class="info-val" id="cntTronchi">0</span>
        </div>
        <div class="info-row">
            <span class="info-key">Buche</span>
            <span class="info-val" id="cntBuche">0</span>
        </div>

        <!-- Per quartiere -->
        <div class="info-section-heading">
            Per quartiere
            <span id="quartieriLoading" class="loading-dot"></span>
        </div>
        <div id="quartieriList"></div>
    </div>
</div>

<!-- LEGENDA -->
<div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--color-rifiuti)"></div>Rifiuti</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--color-piantumazioni)"></div>Piantumazioni</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--color-censimento)"></div>Censimento</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--color-tronchi)"></div>Tronchi</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--color-buche)"></div>Buche</div>
</div>

<div id="status"></div>

<!-- DEBUG PANEL -->
<button id="debugToggle" onclick="toggleDebug()">🐛 Debug</button>
<div id="debugPanel">
    <div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:4px;">Debug log:</div>
    <div id="debugContent"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/exif-js@2.3.0/exif.js"></script>
<script>

// ── STATO GLOBALE ──
const STATE = {
    markers: [],
    loaded: { rifiuti: false, ambiente: false, buche: false },
    counters: { rifiuti: 0, piantumazioni: 0, censimento: 0, tronchi: 0, buche: 0, today: 0 },
    quartiereCache: {},
    quartiereStats: {},
    geocodingQueue: [],
    isGeocoding: false,
    currentFilter: '',
    lastMarker: null,
    currentStyle: null,
    infoPanelOpen: false,
    menuOpen: false,
    // Cache per evitare duplicati
    addedMarkers: new Set(),
    // Per tracciare i duplicati rilevati
    duplicatesDetected: 0,
    duplicateDetails: {},
    // Per il debug
    debugVisible: false
};

const COLORS = {
    rifiuti: '#facc15',
    piantumazioni: '#86efac',

function getUrlParams() {
    const params = new URLSearchParams(window.location.search);
    // Supporta sia mlat/mlon che lat/lng
    const lat = parseFloat(params.get('mlat') || params.get('lat'));
    const lng = parseFloat(params.get('mlon') || params.get('lng') || params.get('lon'));
    const zoom = parseInt(params.get('zoom') || 14);
    // ✅ Tipo di app chiamante: 'rifiuti' | 'ambiente' | 'strade'
    const app = params.get('app') || null;
    // ✅ Quartiere da preselezionare nel filtro (es. da dashboard "I tuoi quartieri")
    const quartiere = params.get('quartiere') || null;
    return { lat, lng, zoom, app, quartiere };
}

    infoPanelEl.style.transition = 'transform 0.3s cubic-bezier(0.32, 0.72, 0, 1)';

// ── POPUP IMG TOGGLE ──
window.togglePopupImg = function(id, btn) {
    const img = document.getElementById(id);
    const wrap = document.getElementById('wrap-' + id);
    const ctrl = document.getElementById('ctrl-' + id);
    if (!img || !wrap) return;
    const visible = wrap.classList.contains('visible');
    if (!visible) {
        wrap.classList.add('visible');
        if (ctrl) ctrl.classList.add('visible');
        btn.textContent = 'Nascondi foto';
        if (!img._exifChecked) {
            img._exifChecked = true;
            img._rotation = 0;
            const applyExif = function() {
                try {
                    EXIF.getData(img, function() {
                        const orientation = EXIF.getTag(this, 'Orientation');
                        const degrees = { 3: 180, 6: 90, 8: 270 };
                        if (degrees[orientation]) {
                            img._rotation = degrees[orientation];
                            applyRotation(img, wrap);
                        }
                    });
                } catch {}
            };
            if (img.complete) applyExif();
            else img.onload = applyExif;
        }
    } else {
        wrap.classList.remove('visible');
        if (ctrl) ctrl.classList.remove('visible');
        btn.textContent = 'Mostra foto';
    }
};

function applyRotation(img, wrap) {
    const deg = img._rotation || 0;
    img.style.transform = `rotate(${deg}deg)`;
    const sideways = deg === 90 || deg === 270;
    if (sideways && img.naturalWidth && img.naturalHeight) {
        const wrapW = wrap.offsetWidth;
        const ratio = img.naturalHeight / img.naturalWidth;
        const renderedH = wrapW * ratio;
        const excess = (renderedH - wrapW) / 2;
        img.style.marginTop = `${excess}px`;
        img.style.marginBottom = `${excess}px`;
        wrap.style.height = `${renderedH}px`;
    } else {
        img.style.marginTop = '0';
        img.style.marginBottom = '0';
        wrap.style.height = 'auto';
    }
}

window.rotateImg = function(id, delta) {
    const img = document.getElementById(id);
    const wrap = document.getElementById('wrap-' + id);
    if (!img || !wrap) return;
    img._rotation = ((img._rotation || 0) + delta + 360) % 360;
    applyRotation(img, wrap);
};

// ── GEOCODING ──
async function getQuartiere(lat, lon) {
    const key = `${lat.toFixed(4)},${lon.toFixed(4)}`;
    if (STATE.quartiereCache[key]) return STATE.quartiereCache[key];
    try {
        const res = await fetch(
            `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=14`,
            { headers: { 'User-Agent': 'CityLogApp/1.0' } }
        );
        if (!res.ok) {
            if (res.status === 429) {
                await new Promise(r => setTimeout(r, 5000));
                return getQuartiere(lat, lon);
            }
            throw new Error('Geocoding failed');
        }
        const data = await res.json();
        const q = data.address?.suburb || data.address?.neighbourhood ||
                  data.address?.quarter || data.address?.city_district || 'Centro';
        const normalized = q.replace(/^(Quartiere|Q\.)\s*/i, '').trim() || 'Centro';
        STATE.quartiereCache[key] = normalized;
        return normalized;
    } catch {
        STATE.quartiereCache[key] = 'Sconosciuto';
        return 'Sconosciuto';
    }
}

async function processGeocodingQueue() {
    if (STATE.isGeocoding) return;
    STATE.isGeocoding = true;
    const loadingEl = document.getElementById('quartieriLoading');

    while (STATE.geocodingQueue.length > 0) {
        const item = STATE.geocodingQueue.shift();
        try {
            const q = await getQuartiere(item.lat, item.lon);
            item.marker.quartiere = q;
            const pqEl = document.getElementById(item.popupQId);
            if (pqEl) pqEl.textContent = 'Quartiere: ' + q;
            if (!STATE.quartiereStats[q]) STATE.quartiereStats[q] = {};
            STATE.quartiereStats[q][item.type] = (STATE.quartiereStats[q][item.type] || 0) + 1;
            if (STATE.lastMarker === item.marker) {
                document.getElementById('iQuartiere').textContent = q;
            }
        } catch {}

        if (loadingEl) {
            loadingEl.textContent = STATE.geocodingQueue.length > 0
                ? ` (${STATE.geocodingQueue.length})` : '';
        }

        if (STATE.geocodingQueue.length > 0) {
            await new Promise(r => setTimeout(r, 1200));
        }
    }

    STATE.isGeocoding = false;
    if (loadingEl) loadingEl.textContent = '';
    renderQuartieriList();
    renderQuartiereFilter();
    syncQuartieriToServer();
}

function renderQuartieriList() {
    const el = document.getElementById('quartieriList');
    if (!el) return;
    const sorted = Object.keys(STATE.quartiereStats).sort();
    if (sorted.length === 0) {
        el.innerHTML = '<div style="color:var(--text-muted);font-size:0.8rem;">Nessun dato</div>';
        return;
    }
    el.innerHTML = sorted.map(q => {
        const total = Object.values(STATE.quartiereStats[q]).reduce((a, b) => a + b, 0);
        return `<div class="quartiere-row"><strong>${q}</strong><span>${total}</span></div>`;
    }).join('');
}

function renderQuartiereFilter() {
    const el = document.getElementById('quartiereFilter');
    if (!el) return;
    const current = el.value;
    const sorted = Object.keys(STATE.quartiereStats).sort();
    el.innerHTML = '<option value="">Tutti i quartieri</option>' +
        sorted.map(q => `<option value="${q}">${q}</option>`).join('');
    el.value = current;
}

function isToday(dateStr) {
    if (!dateStr) return false;
    try {
        const d = new Date(dateStr), now = new Date();
        return d.getDate() === now.getDate() &&
               d.getMonth() === now.getMonth() &&
               d.getFullYear() === now.getFullYear();
    } catch { return false; }
}

// ── FUNZIONE RIEPILOGO DUPLICATI ──
function logDuplicateSummary() {
    const dupeCounts = {};
    const dupeDetails = {};

    STATE.markers.forEach(m => {
        if (m.image_id) {
            if (!dupeCounts[m.image_id]) {
                dupeCounts[m.image_id] = 0;
                dupeDetails[m.image_id] = [];
            }
            dupeCounts[m.image_id]++;
            dupeDetails[m.image_id].push({
                type: m.type,
                lat: m.lat,
                lon: m.lon,
                addr: m.addr
            });
        }
    });

    const dupes = Object.entries(dupeCounts).filter(([id, count]) => count > 1);
    if (dupes.length > 0) {
        debugLog(`📊 RIEPILOGO DUPLICATI: ${dupes.length} image_id duplicati`, 'warn');
        dupes.forEach(([id, count]) => {
            const details = dupeDetails[id];
            const types = details.map(d => d.type).join(', ');
            debugLog(`   📌 ${id}: ${count} occorrenze (tipi: ${types})`, 'warn');
            details.forEach((d, idx) => {
                debugLog(`      #${idx+1}: tipo=${d.type}, lat=${d.lat.toFixed(6)}, lon=${d.lon.toFixed(6)}`, 'info');
            });
        });
    } else {
        debugLog(`✅ Nessun duplicato rilevato nei marker caricati`, 'success');
    }
}

async function loadLayer(layerName, city) {
    if (STATE.loaded[layerName]) return;

    const config = {
        rifiuti: {
            urls: [`https://api.citylog.cloud/rifiuti/no-auth?city=${encodeURIComponent(city)}`],
            types: ['rifiuti'],
            cluster: clusters.rifiuti,
            label: 'Rifiuti'
        },
        ambiente: {
            urls: [
                `https://api.citylog.cloud/piantumazione/no-auth?city=${encodeURIComponent(city)}`,
                `https://api.citylog.cloud/censimento/no-auth?city=${encodeURIComponent(city)}`,
                `https://api.citylog.cloud/tronchi/no-auth?city=${encodeURIComponent(city)}`
            ],
            types: ['piantumazioni', 'censimento', 'tronchi'],
            cluster: clusters.ambiente,
            label: 'Ambiente'
        },
        buche: {
            urls: [`https://api.citylog.cloud/strade/no-auth?city=${encodeURIComponent(city)}`],
            types: ['buche'],
            cluster: clusters.buche,
            label: 'Buche'
        }
    };

    const cfg = config[layerName];
    showStatus(`Caricamento ${cfg.label}…`);
    debugLog(`🔄 Caricamento layer: ${cfg.label}`);
    let total = 0;
    let duplicates = 0;

    for (let i = 0; i < cfg.urls.length; i++) {
        try {
            const res = await fetch(cfg.urls[i]);
            if (!res.ok) {
                debugLog(`⚠️ Errore HTTP ${res.status} per ${cfg.urls[i]}`, 'warn');
                continue;
            }
            const data = await res.json();
            if (!Array.isArray(data)) {
                debugLog(`⚠️ Risposta non valida per ${cfg.urls[i]}`, 'warn');
                continue;
            }

            debugLog(`📦 ${cfg.label}: ricevuti ${data.length} elementi da ${cfg.urls[i]}`);

            data.forEach(item => {
                const latStr = item.latitude || item.lat;
                const lonStr = item.longitude || item.lon;
                const lat = parseFloat(latStr);
                const lon = parseFloat(lonStr);
                if (isNaN(lat) || isNaN(lon)) return;

                const segnalazioneId = item.id || item.segnalazione_id || item.pk || 'N/A';
                const imageId = item.image_id;
                const type = cfg.types[i];

                let uniqueId;
                if (imageId) {
                    uniqueId = `img_${imageId}`;
                } else {
                    const roundedLat = Math.round(lat * 1000000) / 1000000;
                    const roundedLon = Math.round(lon * 1000000) / 1000000;
                    uniqueId = `coord_${roundedLat}_${roundedLon}_${type}`;
                }

                if (STATE.addedMarkers.has(uniqueId)) {
                    duplicates++;
                    STATE.duplicatesDetected++;
                    debugLog(
                        `⚠️ DUPLICATO IGNORATO: ${uniqueId} ` +
                        `(ID segnalazione: ${segnalazioneId}, tipo: ${type})`,
                        'warn'
                    );
                    return;
                }

                STATE.addedMarkers.add(uniqueId);

                const addr = item.address || '—';
                const time = item.image_time
                    ? new Date(item.image_time).toLocaleString('it-IT')
                    : '—';
                const imgUrl = item.image_url || '';
                const knownQuartiere = item.quartiere || null;

                if (isToday(item.image_time)) STATE.counters.today++;
                STATE.counters[type] = (STATE.counters[type] || 0) + 1;

                addMarker(lat, lon, addr, time, imgUrl, type, cfg.cluster, imageId, latStr, lonStr, knownQuartiere);
                total++;

                if (total % 50 === 0) {
                    debugLog(`✅ ${cfg.label}: ${total} marker aggiunti`);
                }
            });
        } catch (e) {
            debugLog(`❌ Errore caricamento ${cfg.urls[i]}: ${e.message}`, 'error');
        }
    }

    STATE.loaded[layerName] = true;
    const msg = total > 0 ?
        `${cfg.label}: ${total} marker aggiunti (${duplicates} duplicati ignorati)` :
        `${cfg.label}: nessun dato`;
    showStatus(msg);
    debugLog(`✅ Completato ${cfg.label}: ${total} marker, ${duplicates} duplicati ignorati`);
    updateCounters();
    renderQuartieriList();
    renderQuartiereFilter();
    logDuplicateSummary();
}

// ── TOGGLE LAYER ──
// force: se true forza lo stato a "attivo" invece di invertirlo (usato per l'attivazione da ?app=)
async function toggleLayer(name, force = null) {
    const chk = document.getElementById('chk' + name.charAt(0).toUpperCase() + name.slice(1));
    if (!chk) return;

    if (force === true) {
        if (chk.checked) return; // già attivo, non fare nulla
        chk.checked = true;
    } else if (force === false) {
        if (!chk.checked) return; // già spento, non fare nulla
        chk.checked = false;
    } else {
        chk.checked = !chk.checked;
    }

    if (chk.checked) {
        if (!STATE.loaded[name]) {
            const city = await getCity();
            await loadLayer(name, city);
        }
        map.addLayer(clusters[name]);
        debugLog(`👁️ Layer ${name} attivato`);
    } else {
        map.removeLayer(clusters[name]);
        debugLog(`👁️ Layer ${name} disattivato`);
    }
    updateCounters();
}

// ── FILTRO QUARTIERE ──
function filterByQuartiere() {
    STATE.currentFilter = document.getElementById('quartiereFilter').value;
    Object.values(clusters).forEach(g => g.clearLayers());

    STATE.markers.forEach(({ marker, type }) => {
        const show = !STATE.currentFilter || marker.quartiere === STATE.currentFilter;
        if (!show) return;
        if (type === 'rifiuti') clusters.rifiuti.addLayer(marker);
        else if (type === 'buche') clusters.buche.addLayer(marker);
        else clusters.ambiente.addLayer(marker);
    });

    Object.values(clusters).forEach(g => { if (map.hasLayer(g)) g.refreshClusters(); });

    if (STATE.currentFilter) {
        const filtered = STATE.markers.filter(m => m.marker.quartiere === STATE.currentFilter);
        debugLog(`🔍 Filtro per quartiere: ${STATE.currentFilter} (${filtered.length} marker)`);
        if (filtered.length > 0) {
            const group = L.featureGroup(filtered.map(m => m.marker));
            map.fitBounds(group.getBounds().pad(0.2));
        }
    } else {
        debugLog('🔍 Filtro rimosso');
    }
}

// ── RICERCA ──
function searchAddress() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!query) return;

    const matches = STATE.markers.filter(m => m.addr?.toLowerCase().includes(query));
    if (matches.length > 0) {
        const group = L.featureGroup(matches.map(m => m.marker));
        map.fitBounds(group.getBounds().pad(0.2));
        if (matches.length === 1) matches[0].marker.openPopup();
        debugLog(`🔍 Ricerca "${query}": trovati ${matches.length} marker`);
        return;
    }

    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Brescia')}&limit=1`)
        .then(r => r.json())
        .then(data => {
            if (data?.length > 0) {
                map.setView([parseFloat(data[0].lat), parseFloat(data[0].lon)], 16);
                debugLog(`🔍 Ricerca "${query}": trovata posizione`);
            } else {
                showStatus('Indirizzo non trovato');
                debugLog(`🔍 Ricerca "${query}": nessun risultato`, 'warn');
            }
        })
        .catch(() => showStatus('Errore ricerca'));
}

// ── CENTRA ──
function centerMap() {
    const active = STATE.markers.filter(m => map.hasLayer(m.marker));
    if (active.length > 0) {
        const group = L.featureGroup(active.map(m => m.marker));
        map.fitBounds(group.getBounds().pad(0.1));
        debugLog(`📍 Centra mappa: ${active.length} marker attivi`);
    } else {
        map.setView([45.521, 10.212], 14);
        debugLog('📍 Centra mappa: viewport default');
    }
}

// ── MOSTRA TUTTI ──
async function showAll() {
    const city = await getCity();
    for (const name of ['rifiuti', 'ambiente', 'buche']) {
        const chk = document.getElementById('chk' + name.charAt(0).toUpperCase() + name.slice(1));
        if (chk && !chk.checked) {
            chk.checked = true;
            if (!STATE.loaded[name]) await loadLayer(name, city);
            map.addLayer(clusters[name]);
        }
    }
    debugLog('📊 Mostra tutti i layer attivi');
    updateCounters();
}

// ── GEOLOCALIZZAZIONE ──
function locateUser() {
    if (!navigator.geolocation) {
        showStatus('Geolocalizzazione non supportata');
        debugLog('📍 Geolocalizzazione non supportata', 'error');
        return;
    }
    map.locate({ setView: true, maxZoom: 16, timeout: 10000, enableHighAccuracy: true });
    map.once('locationfound', e => {
        L.marker(e.latlng, {
            icon: L.divIcon({
                html: '<div style="background:#3b82f6;width:14px;height:14px;border-radius:50%;border:2px solid white;box-shadow:0 0 8px rgba(59,130,246,0.6);"></div>',
                className: '',
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            })
        }).addTo(map).bindPopup('La tua posizione').openPopup();
        showStatus('Posizione trovata');
        debugLog(`📍 Posizione trovata: ${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`);
    });
    map.once('locationerror', () => {
        showStatus('Impossibile trovare la posizione');
        debugLog('📍 Errore geolocalizzazione', 'error');
    });
}

// ── EXPORT CSV ──
function exportCSV() {
    let csv = 'ID Segnalazione,Image ID,Tipologia,Quartiere,Indirizzo,Data,Lat,Lon\n';
    STATE.markers.forEach(m => {
        const segId = m.id || 'N/A';
        csv += `${segId},"${m.image_id || ''}","${m.type}","${m.marker.quartiere || ''}","${m.addr}","${m.time}",${m.lat},${m.lon}\n`;
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    a.download = `segnalazioni_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    debugLog(`📊 Esportato CSV: ${STATE.markers.length} righe`);
}

// ── SYNC QUARTIERI ──
async function syncQuartieriToServer() {
    const daInviare = STATE.markers
        .filter(m =>
            m.marker.quartiere &&
            m.marker.quartiere !== 'Sconosciuto' &&
            !m.synced
        )
        .map(m => ({
            image_id: m.image_id,
            id: m.id || undefined,
            latitudine: m.latStr,
            longitudine: m.lonStr,
            typo: m.type,
            quartiere: m.marker.quartiere
        }));

    if (daInviare.length === 0) {
        debugLog('📤 Nessun nuovo quartiere da sincronizzare');
        return;
    }

    debugLog(`📤 Sincronizzazione di ${daInviare.length} quartieri...`);
    showStatus(`Sincronizzazione di ${daInviare.length} quartieri...`);

    try {
        const response = await fetch('https://api.citylog.cloud/quartieri/batch-update', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ updates: daInviare })
        });

        if (!response.ok) {
            showStatus('Errore durante la sincronizzazione');
            debugLog(`❌ Errore sincronizzazione: HTTP ${response.status}`, 'error');
            return;
        }

        const data = await response.json();
        showStatus(`Quartieri aggiornati: ${data.updated}, non trovati: ${data.not_found}`);
        debugLog(`✅ Sincronizzazione completata: ${data.updated} aggiornati, ${data.not_found} non trovati`);

        daInviare.forEach(item => {
            const markerObj = STATE.markers.find(
                m => m.lat === parseFloat(item.latitudine) &&
                     m.lon === parseFloat(item.longitudine) &&
                     m.type === item.typo
            );
            if (markerObj) markerObj.synced = true;
        });

    } catch (e) {
        showStatus('Errore di rete nella sincronizzazione quartieri');
        debugLog(`❌ Errore sincronizzazione: ${e.message}`, 'error');
    }
}

// ── INIT ──
(async () => {
    debugLog('🚀 Avvio CityLog Mappa');
    debugLog(`📱 Dispositivo: ${window.innerWidth <= 768 ? 'Mobile' : 'Desktop'}`);
    if (urlParams.app) {
        debugLog(`🏷️ App chiamante: ${urlParams.app}`);
    }

    setStyle('light');

    const city = await getCity();
    debugLog(`📍 Città rilevata: ${city}`);

    // ✅ Determina quale layer caricare di default all'avvio:
    // - se ?app= specifica un layer valido, carica SOLO quello
    // - altrimenti (nessun ?app=, o app='rifiuti'), comportamento storico: rifiuti
    const requestedLayer = (urlParams.app && APP_TO_LAYER[urlParams.app])
        ? APP_TO_LAYER[urlParams.app]
        : 'rifiuti';

    const checkboxIdMap = { rifiuti: 'chkRifiuti', ambiente: 'chkAmbiente', buche: 'chkBuche' };

    await loadLayer(requestedLayer, city);
    document.getElementById(checkboxIdMap[requestedLayer]).checked = true;
    map.addLayer(clusters[requestedLayer]);
    debugLog(`🎯 Layer di avvio: ${requestedLayer}${urlParams.app ? ` (da ?app=${urlParams.app})` : ' (default)'}`);

    // ✅ Se l'URL specifica un quartiere (es. da dashboard "I tuoi quartieri"),
    // carica TUTTI i layer (un quartiere può avere rifiuti + ambiente + strade)
    // e seleziona automaticamente quel quartiere nel filtro esistente.
    if (urlParams.quartiere) {
        await applyQuartiereFromUrl(urlParams.quartiere);
    }

    updateCounters();
    showStatus('');
    debugLog(`✅ Avvio completato: ${STATE.markers.length} marker caricati`);

    if (STATE.duplicatesDetected > 0) {
        debugLog(`⚠️ Attenzione: ${STATE.duplicatesDetected} duplicati rilevati e ignorati durante il caricamento`, 'warn');
    }
})();

// ── APPLICA QUARTIERE DA URL ──
// Carica tutti i layer e seleziona il quartiere richiesto nel filtro,
// riusando la stessa select/filterByQuartiere() già presenti nel menu.
async function applyQuartiereFromUrl(target) {
    debugLog(`📍 Quartiere richiesto da URL: ${target}`);
    await showAll(); // carica rifiuti + ambiente + strade, necessario per coprire tutti i tipi del quartiere

    const select = document.getElementById('quartiereFilter');
    if (!select) return;

    // Le opzioni del filtro si popolano anche in modo asincrono (geocoding),
    // quindi si prova per qualche secondo prima di arrendersi.
    let attempts = 0;
    const maxAttempts = 20; // ~6 secondi totali (20 x 300ms)

    function tryApply() {
        attempts++;
        const match = Array.from(select.options).find(o => o.value === target);
        if (match) {
            select.value = target;
            filterByQuartiere();
            debugLog(`✅ Quartiere "${target}" selezionato e filtro applicato`);
        } else if (attempts < maxAttempts) {
            setTimeout(tryApply, 300);
        } else {
            debugLog(`⚠️ Quartiere "${target}" non trovato tra le opzioni disponibili`, 'warn');
        }
    }
    tryApply();
}
