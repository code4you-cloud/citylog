{# templates/statistiche/dashboard.html #}
{% extends "base.html" %}
{% load static %}

{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-3">
  
  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold text-primary m-0">📊 Statistiche Territoriali</h2>
      <p class="text-muted small m-0">Analisi segnalazioni per quartiere</p>
    </div>
    
    <!-- FILTRI -->
    <div class="d-flex gap-2">
      <select class="form-select w-auto shadow-none" 
              hx-get="{% url 'statistiche:api' %}"
              hx-target="#dashboard-content"
              hx-trigger="change"
              hx-swap="innerHTML"
              name="quartiere">
        <option value="all">📌 Tutti i quartieri</option>
        {% for q in quartieri_list %}
          <option value="{{ q }}">{{ q }}</option>
        {% endfor %}
      </select>
      
      <button class="btn btn-outline-primary" 
              hx-get="{% url 'statistiche:api' %}?action=dashboard"
              hx-target="#dashboard-content"
              hx-swap="innerHTML">
        🔄 Aggiorna
      </button>
    </div>
  </div>
  
  <!-- CONTENUTO DINAMICO -->
  <div id="dashboard-content" 
       hx-trigger="load"
       hx-get="{% url 'statistiche:api' %}?action=dashboard"
       hx-swap="innerHTML">
    
    <!-- Loader -->
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Caricamento...</span>
      </div>
    </div>
    
  </div>
  
</div>
{% endblock %}
